	<script type="text/javascript">
		$("#flipbook").turn({
			display: 'double',
			width: 2 * 480,
			height: 640,
			acceleration: true,
			pages: 52
		});
		$("#flipbook").bind("turned", function(event, page, view) {
			let visiblePageNumbers = $(this).turn("view");
			$("#flipbook video").each(function() {
					let x = parseInt($(this).data("page"), 10);
					const l = Math.min(...visiblePageNumbers) - 2;
					const h = Math.max(...visiblePageNumbers) + 2;
					if (l <= x && x <= h) {
							this.play().catch(e => console.log("Play blocked:", e));
					} else {
							this.pause();
					}
			});
		});
	</script>
